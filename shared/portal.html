<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://firebasestorage.googleapis.com; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://*.google.com;" />
  <title>YIC Sport School — Student Portal</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="login-screen">
    <div id="portal-login-card" class="login-card">
      <img class="brand-mark login-mark" src="assets/logos/school-logo.png" alt="YIC Sport School logo" />
      <h1>Student Portal</h1>
      <p class="login-sub">Enter your Student ID and PIN (given to you by the school).</p>
      <form id="portal-login-form">
        <div class="filter-group">
          <label for="portal-id">Student ID</label>
          <input id="portal-id" type="text" required autocomplete="off" />
        </div>
        <div class="filter-group">
          <label for="portal-pin">PIN</label>
          <input id="portal-pin" type="text" required autocomplete="off" />
        </div>
        <p id="portal-login-error" class="login-error"></p>
        <button type="submit" class="primary-btn login-btn">Log in</button>
      </form>
    </div>

    <div id="portal-dashboard-card" class="login-card hidden" style="max-width: 480px;">
      <h1 id="portal-welcome-title">Welcome</h1>
      <div id="portal-sports" class="student-summary-sports"></div>
      <div id="portal-fees" class="student-summary-fees"></div>
      <div class="table-scroll">
        <table id="portal-fee-table" class="hidden">
          <thead><tr><th>Sport</th><th>Month</th><th>Amount</th><th>Status</th></tr></thead>
          <tbody id="portal-fee-body"></tbody>
        </table>
      </div>
      <p id="portal-updated" class="login-sub"></p>

      <div class="student-manage-section">
        <h3>Profile Photo</h3>
        <div class="avatar-row">
          <img id="portal-avatar-preview" class="avatar-preview" src="assets/logos/school-logo.png" alt="Profile photo" />
          <div class="filter-group">
            <input id="portal-photo-input" type="file" accept="image/jpeg,image/png,image/webp" />
            <button type="button" id="portal-photo-upload-btn" class="connect-btn">Upload photo</button>
          </div>
        </div>
        <p id="portal-photo-error" class="login-error"></p>
        <p id="portal-photo-success" class="login-success"></p>
      </div>

      <div class="student-manage-section">
        <h3>Update Your Info</h3>
        <form id="portal-profile-form">
          <div class="filter-group">
            <label for="portal-phone">Phone</label>
            <input id="portal-phone" type="text" autocomplete="off" />
          </div>
          <div class="filter-group">
            <label for="portal-emergency">Emergency Contact</label>
            <input id="portal-emergency" type="text" autocomplete="off" />
          </div>
          <p id="portal-profile-error" class="login-error"></p>
          <p id="portal-profile-success" class="login-success"></p>
          <button type="submit" class="primary-btn">Save</button>
        </form>
      </div>

      <button type="button" id="portal-logout-btn" class="connect-btn" style="margin-top: 14px;">Log out</button>
    </div>
  </div>

  <script src="portal.bundle.js"></script>
</body>
</html>
